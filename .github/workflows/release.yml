name: Release Firefox Nightly Fork

on:
  push:
    tags:
      - "firefox-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag matching package.json (e.g. firefox-v2.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: firefox-nightly-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  UPDATE_TAG: firefox-nightly-updates
  WXT_SKIP_ENV_VALIDATION: "true"
  SKIP_FREE_API: "true"
  HUSKY: "0"
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    if: github.repository == 'MioriShiratori/read-frog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Verify release
        run: |
          pnpm fmt:check
          pnpm lint
          pnpm test:firefox-release
          pnpm test

      - name: Build Firefox only
        run: pnpm zip:firefox

      - name: Prepare update manifest and reject older versions
        shell: bash
        run: |
          gh release view "$UPDATE_TAG" >/dev/null 2>&1 ||
            gh release create "$UPDATE_TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Firefox Nightly update channel" \
              --notes "Automatic update manifest for the unsigned fork. Install a versioned XPI release first."
          previous=()
          if [[ $(gh release view "$UPDATE_TAG" --json assets --jq 'any(.assets[]; .name == "updates.json")') == true ]]; then
            gh release download "$UPDATE_TAG" --pattern updates.json --dir "$RUNNER_TEMP/previous"
            previous=(--previous "$RUNNER_TEMP/previous/updates.json")
          fi
          pnpm package:firefox-release --tag "$RELEASE_TAG" "${previous[@]}"

      - name: Publish versioned package before advancing channel
        shell: bash
        run: |
          asset=$(find .output/firefox-release -name '*.xpi' -printf '%f\n')
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Read Frog Fork $RELEASE_TAG" \
              --notes "Unsigned Firefox Nightly build. [Installation and configuration migration](https://github.com/MioriShiratori/read-frog/blob/main/FIREFOX-UPDATES.md)."
          if [[ $(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft) == true ]]; then
            gh release upload "$RELEASE_TAG" ".output/firefox-release/$asset" .output/*-sources.zip --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest=true
          else
            # Retry a failed channel upload without replacing a published package.
            gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$RUNNER_TEMP/published"
            pnpm package:firefox-release --tag "$RELEASE_TAG" --zip "$RUNNER_TEMP/published/$asset"
          fi
          gh release upload "$UPDATE_TAG" .output/firefox-release/updates.json --clobber
